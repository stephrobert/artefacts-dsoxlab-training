---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# DEUX MACHINES, DEUX GROUPES. dsoxlab injecte un groupe par target déclarée
# dans lab.yaml : ici `lab_depot` et `lab_client`. `lab_target` ne désigne que
# la target par DÉFAUT, donc le dépôt seul.
#
# L'erreur à ne pas refaire, mesurée en écrivant ce lab : un play sur
# `lab_target` installe les outils du client... sur le dépôt. Le test
# échouait alors sur « /tmp/essai/bin/pip: No such file or directory »,
# message qui ne dit nulle part que `python3-venv` manque sur l'autre
# machine.
#
# CE QUE LE SETUP DONNE. Une instance Pulp déjà en service sur le dépôt (ce
# lab enseigne le proxy, pas l'installation), et de quoi installer un paquet
# côté client.
#
# CE QUE LE SETUP NE FAIT PAS. Ni remote, ni dépôt, ni synchronisation, ni
# distribution : ce sont les quatre gestes que les tests cherchent.

- name: Outils du poste client
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi créer un environnement virtuel et installer un paquet
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Préparer le dépôt
  hosts: lab_target
  become: true
  tasks:
    - name: De quoi couper la sortie réseau pendant la validation
      ansible.builtin.apt:
        name:
          - iptables
          - jq
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: L'instance Pulp du lab précédent est en marche
      ansible.builtin.command:
        cmd: sudo -iu student podman ps --format {{ '{{' }}.Names{{ '}}' }}
      register: conteneurs
      changed_when: false
      failed_when: false

    - name: Le prérequis est nommé s'il manque
      ansible.builtin.fail:
        msg: >-
          L'instance Pulp n'est pas en service sur cette machine. Ce lab
          suppose pulp-01-installer terminé : lance-le d'abord.
      when: "'pulp' not in (conteneurs.stdout | default(''))"

    - name: Aucun dépôt, remote ni distribution d'un essai précédent
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          sudo -iu student pulp python distribution destroy --name pypi 2>/dev/null || true
          sudo -iu student pulp python repository destroy --name pypi-cache 2>/dev/null || true
          sudo -iu student pulp python remote destroy --name pypi-proxy 2>/dev/null || true
        executable: /bin/bash
      changed_when: false
      failed_when: false
